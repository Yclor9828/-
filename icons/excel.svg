<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="x_back" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#107C41"/>
      <stop offset="100%" stop-color="#0A4C27"/>
    </linearGradient>
    <linearGradient id="x_front" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1D9A57"/>
      <stop offset="100%" stop-color="#107C41"/>
    </linearGradient>
  </defs>
  <!-- Background Plate -->
  <rect x="7" y="4" width="20" height="24" rx="2" fill="url(#x_back)"/>
  <!-- Decorative Grid Lines -->
  <rect x="15" y="9" width="9" height="2" rx="1" fill="#FFFFFF" opacity="0.6"/>
  <rect x="15" y="13" width="9" height="2" rx="1" fill="#FFFFFF" opacity="0.6"/>
  <rect x="15" y="17" width="9" height="2" rx="1" fill="#FFFFFF" opacity="0.6"/>
  <rect x="15" y="21" width="9" height="2" rx="1" fill="#FFFFFF" opacity="0.6"/>
  <!-- Front Brand Square -->
  <rect x="4" y="8" width="16" height="16" rx="2.5" fill="url(#x_front)"/>
  <!-- X Letter -->
  <text x="12" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-weight="900" font-size="11" fill="#FFFFFF" text-anchor="middle">X</text>
</svg>