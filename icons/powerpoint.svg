<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="p_back" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C43E1C"/>
      <stop offset="100%" stop-color="#8E2A11"/>
    </linearGradient>
    <linearGradient id="p_front" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ED5C38"/>
      <stop offset="100%" stop-color="#C43E1C"/>
    </linearGradient>
  </defs>
  <!-- Background Plate -->
  <rect x="7" y="4" width="20" height="24" rx="2" fill="url(#p_back)"/>
  <!-- Decorative Pie/Chart -->
  <circle cx="19.5" cy="16" r="4.5" fill="#FFFFFF" opacity="0.6"/>
  <!-- Front Brand Square -->
  <rect x="4" y="8" width="16" height="16" rx="2.5" fill="url(#p_front)"/>
  <!-- P Letter -->
  <text x="12" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-weight="900" font-size="11" fill="#FFFFFF" text-anchor="middle">P</text>
</svg>